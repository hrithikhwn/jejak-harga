# Builds the site from the data in the repo and publishes it on GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# Security:
# - Each job gets only the permissions it needs. The build job, which installs and
#   runs other people's code (npm and PyPI packages), can only read the repo. Only
#   the deploy job, which runs no third-party packages, may publish.
# - Actions are pinned to the exact commit of a release (the version is in the
#   comment), so a moved or hijacked tag can't change what runs here.
# - Packages install from the lockfile / exact pins, without running install scripts
#   or building from source.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {} # nothing by default; each job asks for what it needs below

concurrency:
  group: pages
  cancel-in-progress: false # let a deploy that has started finish

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the access token in .git/config

      # The data checks (tests/test_data.py) on the committed data.
      # --only-binary: install ready-made wheels only, never run a package's build code.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # (quoted, because YAML would read the ": " after ":all" as a key)
      - run: 'pip install --only-binary=:all: -r requirements.txt'
      - run: pytest

      # The site: npm ci installs exactly what package-lock.json lists and checks each
      # package's hash; --ignore-scripts stops packages running code while installing.
      # npm run build then runs the site tests and builds into site/dist/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: site
      - run: npm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # lets Pages check the upload really comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
