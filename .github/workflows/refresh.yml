# Refreshes the data every day and redeploys the site, with no manual work.
#
# 1. refresh: runs pipeline/build.py (the previous and current month) and the data
#    checks. It runs other people's code (PyPI packages), so it can only read the
#    repo. If a check fails, the run stops: nothing is committed or published, and
#    GitHub emails the repo owner.
# 2. publish: commits only the data files, pushes them, and starts the deploy
#    workflow. It can write to the repo, so it runs no third-party packages: only
#    git and GitHub's own gh tool.
#
# When: PriceCatcher's files change at about 12:00 UTC (8pm in Malaysia). This runs
# at 13:17 UTC (9:17pm): an hour's margin, and away from the top of the hour, when
# GitHub's scheduled runs are busiest and most often delayed.
name: Refresh data

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: # run it by hand from the Actions tab

permissions: {} # nothing by default; each job asks for what it needs below

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the access token in .git/config

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # (quoted, because YAML would read the ": " after ":all" as a key)
      - run: 'pip install --only-binary=:all: -r requirements.txt'

      # Daily mode: re-download the previous and current month and replace them
      - run: python pipeline/build.py
      # Stop here if the new data looks broken
      - run: pytest

      # Hand the new data to the publish job
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data
          path: |
            data/monthly_prices.parquet
            data/monthly_quality.parquet
            site/public/data/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the new data
      actions: write # start the deploy workflow
    steps:
      # Keeps the access token (the default) so git can push. Safe here: this job
      # runs nothing but git and gh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Puts the new files over the checked-out ones (download v8 also fails if a
      # file's checksum doesn't match what was uploaded)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data

      - name: Commit and push the new data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monthly_prices.parquet data/monthly_quality.parquet site/public/data
          if git diff --cached --quiet; then
            echo "Nothing changed, so nothing to commit or deploy."
            exit 0
          fi
          # Read the date on its own line, so the step stops if it can't be read
          until=$(jq -r .data_until site/public/data/meta.json)
          git commit -m "Refresh data: prices up to $until"
          # If someone pushed to main while this ran, put the data commit on top of theirs
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GitHub doesn't start other workflows from a push made by a workflow (its guard
      # against loops), so ask for a deploy run directly
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
